# LL-Connect 3 CI
#
# Jobs:
#   kernel-module  build the Lian_Li_SL_INFINITY module against the runner's
#                  kernel headers, then register/build/install it through DKMS
#                  exactly as `make dkms-install` does on a user's machine
#   app            configure + build the Qt 6 desktop app (Release)
#   unicode        scan sources for Trojan-Source / invisible Unicode
#   shellcheck     lint install.sh / uninstall.sh
#   zizmor         security audit of these GitHub Actions workflows
#
# All jobs run on x86_64 ubuntu-24.04 — the project targets desktop Linux.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push to the same ref makes in-flight runs obsolete — cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel-module:
    name: Kernel module (build + DKMS)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install kernel headers and DKMS
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential dkms "linux-headers-$(uname -r)"
          echo "Runner kernel: $(uname -r)"

      - name: Build module out-of-tree
        working-directory: kernel
        run: |
          set -euo pipefail
          make
          test -f Lian_Li_SL_INFINITY.ko
          modinfo ./Lian_Li_SL_INFINITY.ko

      - name: Register, build and install through DKMS
        # Exercises dkms.conf and the Makefile's dkms-install target the same
        # way install.sh does. The module is built but never loaded: the
        # runner has no Lian Li hub, and loading is not what this job checks.
        working-directory: kernel
        run: |
          set -euo pipefail
          make clean
          make dkms-install
          dkms status | tee /dev/stderr | grep -q '^lian-li-sl-infinity/.*installed'
          modinfo Lian_Li_SL_INFINITY | grep -E '^(filename|version):'
          make dkms-uninstall
          if dkms status | grep -q '^lian-li-sl-infinity/'; then
            echo "::error::dkms-uninstall left the module registered"
            exit 1
          fi

  app:
    name: Qt app (Release build)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            qt6-base-dev \
            libusb-1.0-0-dev libhidapi-dev

      - name: Configure
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-ci --parallel "$(nproc)"

      - name: Verify binary
        run: |
          set -euo pipefail
          test -x build-ci/LLConnect3
          file build-ci/LLConnect3

  unicode:
    name: Unicode scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Scan for Trojan-Source / invisible Unicode
        # Guards against CVE-2021-42574: bidi controls / zero-width characters
        # that make source render differently than it compiles.
        run: python3 .github/scripts/check-unicode.py

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          echo "Linting: ${scripts[*]}"
          shellcheck -S warning "${scripts[@]}"

  zizmor:
    name: zizmor (workflow audit)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        # Prebuilt x86_64 release binary, checksum-verified before it runs — a
        # security-audit job must not itself execute an unverified download.
        # Bump `ver` and `sha256` together when upgrading.
        run: |
          set -euo pipefail
          ver=1.25.2
          sha256=aa1facd105f0d83fe5c55b1adcd9d7417de5d83aa27471f91dc0b66cf3803577
          curl -fsSL "https://github.com/zizmorcore/zizmor/releases/download/v${ver}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/zizmor.tgz
          echo "${sha256}  /tmp/zizmor.tgz" | sha256sum --check --strict -
          tar -xzf /tmp/zizmor.tgz -C /tmp
          if [ ! -x /tmp/zizmor ]; then
            echo "::error::zizmor binary not found at /tmp/zizmor after extraction (archive layout changed?)"
            exit 1
          fi
          sudo install /tmp/zizmor /usr/local/bin/zizmor
          zizmor --version

      - name: Audit workflows
        # Offline audit: deterministic, no token/network.
        run: zizmor --offline .github/workflows/
